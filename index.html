<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0d0d0d;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 16px;
      padding: 24px;
      max-width: 360px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .btn {
      display: inline-block;
      width: 100%;
      background: #00f2fe;
      background: linear-gradient(45deg, #00f2fe, #4facfe);
      color: #000;
      font-weight: bold;
      padding: 14px 0;
      border-radius: 30px;
      text-decoration: none;
      margin-top: 16px;
      font-size: 16px;
      box-sizing: border-box;
    }
    .guide {
      font-size: 13px;
      color: #aaa;
      margin-top: 16px;
      line-height: 1.4;
    }
  </style>
  <script>
    (function() {
      // YOUR ADSTERRA DIRECT LINK
      var rawAdsterraLink = "https://uplcm.com/4/11822858";

      var ua = navigator.userAgent || navigator.vendor || window.opera;
      var isAndroid = /android/i.test(ua);
      var isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
      var isTikTok = (ua.indexOf("Bytedance") > -1 || ua.indexOf("TikTok") > -1);

      // 1. ANDROID AUTOMATIC BREAKOUT
      if (isAndroid && isTikTok) {
        var cleanUrl = rawAdsterraLink.replace(/^https?:\/\//, '');
        var intentUrl = "intent://" + cleanUrl + "#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=" + encodeURIComponent(rawAdsterraLink) + ";end;";
        window.location.replace(intentUrl);
        return;
      }

      // 2. iOS IN TIKTOK HANDLING
      document.addEventListener("DOMContentLoaded", function() {
        var btn = document.getElementById("continue-btn");
        var iosBanner = document.getElementById("ios-banner");

        if (isIOS && isTikTok) {
          // Display the custom iOS bridge UI
          iosBanner.style.display = "block";
          
          // Use Safari window creation trick on tap
          btn.addEventListener("click", function(e) {
            e.preventDefault();
            // Opening target _blank forces iOS WebKit to launch in an external browser tab
            window.open(rawAdsterraLink, '_blank');
          });
        } else {
          // Standard Browser (Safari/Chrome native or desktop) -> Direct Redirect
          window.location.replace(rawAdsterraLink);
        }
      });
    })();
  </script>
</head>
<body>

  <div class="card" id="ios-banner" style="display: none;">
    <h2>🚀 Almost There!</h2>
    <p>To view this content with full access, tap below to open in your browser.</p>
    
    <a href="#" id="continue-btn" class="btn">Open in Safari / Browser</a>

    <div class="guide">
      <p>💡 <em>If it stays inside TikTok: Tap <strong>•••</strong> in the top right corner and select <strong>"Open in Safari"</strong>.</em></p>
    </div>
  </div>

</body>
</html>
