<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opening browser...</title>
</head>
<body>
  <p>Opening browser...</p>

  <script>
    (function () {
      var targetUrl =
        "https://asiafilm.org/4/52b5dc35d17cbe47a4bc7c296c0f5010";

      var ua = navigator.userAgent || "";
      var isAndroid = /Android/i.test(ua);
      var isTikTok = /TikTok|Bytedance/i.test(ua);

      if (isAndroid && isTikTok) {
        var cleanUrl = targetUrl.replace(/^https?:\/\//i, "");

        var intentUrl =
          "intent://" + cleanUrl +
          "#Intent;scheme=https;" +
          "action=android.intent.action.VIEW;" +
          "package=com.android.chrome;end";

        window.location.href = intentUrl;
      } else {
        window.location.replace(targetUrl);
      }
    })();
  </script>
</body>
</html>
