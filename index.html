<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting...</title>
  <script>
    (function() {
      // REPLACE THIS WITH YOUR EXACT ADSTERRA DIRECT LINK
      var rawAdsterraLink = "https://asiafilm.org/4/52b5dc35d17cbe47a4bc7c296c0f5010";

      var ua = navigator.userAgent || navigator.vendor || window.opera;
      var isAndroid = /android/i.test(ua);
      var isInApp = (ua.indexOf("Bytedance") > -1 || ua.indexOf("TikTok") > -1 || ua.indexOf("FB_IAB") > -1);

      if (isAndroid && isInApp) {
        // Strip http:// or https:// from the link
        var cleanUrl = rawAdsterraLink.replace(/^https?:\/\//, '');

        // Construct an Android Intent URI with the target embedded
        // This launches Chrome directly without loading the Adsterra URL inside TikTok
        var intentUrl = "intent://" + cleanUrl + "#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=" + encodeURIComponent(rawAdsterraLink) + ";end;";

        window.location.replace(intentUrl);
      } else {
        // Standard browsers or iOS
        window.location.replace(rawAdsterraLink);
      }
    })();
  </script>
</head>
<body>
  <p style="text-align: center; margin-top: 20%; font-family: sans-serif;">
    Opening link in browser...
  </p>
</body>
</html>
